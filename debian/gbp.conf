[DEFAULT]
pristine-tar = True
sign-tags = True
debian-branch = debian
# Upstream tarballs are repacked (+ds) to drop non-free fonts, see
# Files-Excluded in debian/copyright.  The filtered trees live on the
# "upstream" branch, each linked to upstream's own git release tag.
upstream-branch = upstream
upstream-tag = upstream/%(version)s

[import-orig]
# gbp strips the +ds suffix when resolving this tag
upstream-vcs-tag = v%(version)s
